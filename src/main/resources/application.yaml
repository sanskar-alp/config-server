server:
  port: 8080

spring:
  application:
    name: config-server
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: git,vault
  cloud:
    config:
      allowOverride: true
      overrideNone: false
      overrideSystemProperties: false
      server:
        git:
          uri: ${GITHUB_URL:https://github.com/sanskar-alp/config-repo}
        vault:
          host: 127.0.0.1
          port: 8200
          scheme: http
          backend: secret
          kv-version: 2
          authentication: token
          token: ConfigServerToken
    azure:
      keyvault:
        secret:
          endpoint: https://poc-spring-config-kv.vault.azure.net/
          enabled: true
      credential:
        client-id: ${AZURE_CLIENT_ID}
        client-secret: ${AZURE_CLIENT_SECRET}
        tenant-id: ${AZURE_TENANT_ID}
    vault:
      enabled: true


logging:
  level:
    root: INFO
    org.springframework.cloud.config: DEBUG
    com.azure.identity: DEBUG
    com.azure.security.keyvault: DEBUG